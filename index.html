<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1014" />
    <title>Bili Sound</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="app-main">
        <section id="player-page" class="page active" aria-label="播放器">
          <div id="empty-state" class="empty-state">
            <div class="empty-art" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            </div>
            <h1>还没有播放内容</h1>
            <p>点击右下角添加一个 Bilibili 视频</p>
          </div>

          <section id="player-content" class="player-content" hidden>
            <div class="cover-wrap">
              <div id="cover-placeholder" class="cover-placeholder" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
              </div>
              <img id="cover-image" alt="当前视频封面" referrerpolicy="no-referrer" />
              <div id="loading-mask" class="loading-mask" hidden>
                <span class="spinner" aria-hidden="true"></span>
                <span>正在加载</span>
              </div>
            </div>

            <div class="track-info">
              <div class="title-row"><h1 id="video-title"></h1><button id="favorite-button" class="icon-button" aria-label="收藏当前视频" type="button" disabled>☆</button></div>
              <p id="video-owner"></p>
            </div>

            <div class="progress-block">
              <input id="progress" type="range" min="0" max="1000" value="0" disabled aria-label="播放进度" />
              <div class="time-row">
                <time id="current-time">0:00</time>
                <time id="duration-time">0:00</time>
              </div>
            </div>

            <div class="player-controls" aria-label="播放控制">
              <button id="mode-button" class="control-button mode-control" type="button" aria-label="当前为顺序播放">
                <span id="mode-icon" class="control-icon" aria-hidden="true">↦</span>
                <span id="mode-label">顺序</span>
              </button>
              <button id="previous-button" class="control-button" type="button" aria-label="上一首" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg>
                <span>上一首</span>
              </button>
              <button id="play-button" class="play-button" type="button" aria-label="播放" disabled>
                <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>
                <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg>
              </button>
              <button id="next-button" class="control-button" type="button" aria-label="下一首" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l9 6-9 6z"/></svg>
                <span>下一首</span>
              </button>
              <button id="queue-button" class="control-button" type="button" aria-label="播放列表">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 11h12M4 16h8M19 14v6M16 17h6"/></svg>
                <span>列表</span>
              </button>
            </div>
          </section>

          <button id="add-button" class="fab" type="button" aria-label="添加 BV 号">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </section>

        <section id="profile-page" class="page profile-page" aria-label="我的" hidden></section>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <button class="nav-item active" type="button" data-page="player" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
          <span>播放器</span>
        </button>
        <button class="nav-item" type="button" data-page="profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <audio id="audio-player" preload="metadata"></audio>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="bv-dialog" class="modal">
      <form id="bv-form" class="modal-card">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">添加音频</p>
            <h2>输入 BV 号</h2>
          </div>
          <button id="bv-close" class="icon-button" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <label for="bv-input">BV 号或视频链接</label>
        <input id="bv-input" type="text" autocomplete="off" placeholder="例如 BV1xx411c7mD" required />
        <p id="bv-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button id="bv-cancel" class="secondary-button" type="button">取消</button>
          <button id="bv-submit" class="primary-button" type="submit">确定</button>
        </div>
      </form>
    </dialog>

    <dialog id="queue-dialog" class="bottom-sheet">
      <section class="sheet-card">
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="sheet-header">
          <div>
            <p id="queue-count" class="eyebrow"></p>
            <h2 id="queue-title">播放列表</h2>
          </div>
          <div class="sheet-actions">
            <button id="queue-add" class="small-add-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              添加 BV
            </button>
            <button id="queue-close" class="icon-button" type="button" aria-label="关闭播放列表">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
          </div>
        </header>
        <div id="queue-list" class="queue-list"></div>
      </section>
    </dialog>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
