[package]
name = "everything-player"
version = "0.1.0"
description = "Everything Player Tauri application"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "everything_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
http-body-util = "0.1.3"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = { version = "2.7.3", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
url = "2.5.8"
uuid = { version = "=1.20.0", features = ["v4"] }
